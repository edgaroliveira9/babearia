services:
  db:
    image: mysql:8.4
    container_name: barbearia-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: barbearia
      MYSQL_USER: barbearia
      MYSQL_PASSWORD: barbearia123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/src/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: barbearia-api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: barbearia
      DB_PASSWORD: barbearia123
      DB_NAME: barbearia
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: barbearia-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
